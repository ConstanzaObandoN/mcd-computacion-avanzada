<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Controlador AR - DOM Estrella</title>
  <style>
    body { margin: 0; background: #0b0f19; color: white; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
    #viewport { position: relative; width: 100vw; height: 74vh; background: #000; }
    #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 1; }
    #skeletonCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 2; pointer-events: none; }
    #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

    #panelInfo {
      position: absolute; bottom: 0; left: 0; right: 0; height: 26vh;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); border-top: 1px solid #334155;
      padding: 10px 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; z-index: 10;
    }
    .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .badge { padding: 3px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; }
    .badge-ok { background: #065f46; color: #34d399; }
    .badge-wait { background: #854d0e; color: #fde047; }
    .hands-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hand-card { background: #1e293b; padding: 6px 10px; border-radius: 8px; font-size: 11px; border: 1px solid #334155; }
    .hand-card strong { color: #38bdf8; }
    .gesture-tag { display: inline-block; margin-top: 3px; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
    .tag-idle { background: #475569; color: #cbd5e1; }
    .tag-push { background: #b91c1c; color: #fecaca; }
    .tag-pull { background: #1d4ed8; color: #bfdbfe; }
    .help-hint { font-size: 11px; color: #94a3b8; text-align: center; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="viewport">
    <video id="webcam" playsinline muted></video>
    <canvas id="skeletonCanvas"></canvas>
    <canvas id="threeCanvas"></canvas>
  </div>

  <div id="panelInfo">
    <div class="status-row">
      <span>📡 EMQX: <strong id="netStatus" class="badge badge-wait">Conectando...</strong></span>
      <button onclick="resetDoughLocal()" style="background:#ef4444; border:none; color:white; padding:4px 8px; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer;">🔄 Reset</button>
    </div>

    <div class="hands-grid">
      <div class="hand-card" id="cardH0">
        <div><strong>Mano 1:</strong> <span id="labelH0">Buscando...</span></div>
        <div id="gestureH0" class="gesture-tag tag-idle">Inactiva</div>
      </div>
      <div class="hand-card" id="cardH1">
        <div><strong>Mano 2:</strong> <span id="labelH1">Buscando...</span></div>
        <div id="gestureH1" class="gesture-tag tag-idle">Inactiva</div>
      </div>
    </div>

    <div class="help-hint">
      ☝️ <strong>1 dedo:</strong> Hunde | 🤏 <strong>Pinza:</strong> Jala punta firme
    </div>
  </div>

  <script>
    const USER_ID = "usr_" + Math.random().toString(16).substring(2, 6);
    const TOPIC = "mcd/dom/shared_mesh";

    const videoElement = document.getElementById("webcam");
    const skCanvas = document.getElementById("skeletonCanvas");
    const skCtx = skCanvas.getContext("2d");
    const threeCanvas = document.getElementById("threeCanvas");
    const netStatus = document.getElementById("netStatus");

    // 1. Escena Three.js con cámara más alejada (Margen holgado)
    const viewport = document.getElementById("viewport");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 8.5);

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xfff7ed, 1.3);
    dirLight.position.set(3, 5, 4);
    scene.add(dirLight);

    // Silueta Estrella Reducida (Centro de pantalla con margen)
    const points = [];
    for (let i = 0; i <= 150; i++) {
      const theta = (i / 150) * Math.PI * 2;
      const r = 0.95 + 0.45 * Math.cos(5 * theta); // Radio min: 0.50, máx: 1.40
      points.push(new THREE.Vector3(r * Math.cos(theta), r * Math.sin(theta), -0.05));
    }
    const starGeo = new THREE.BufferGeometry().setFromPoints(points);
    const starMat = new THREE.LineDashedMaterial({ color: 0x38bdf8, dashSize: 0.08, gapSize: 0.04, linewidth: 2 });
    const starLine = new THREE.Line(starGeo, starMat);
    starLine.computeLineDistances();
    scene.add(starLine);

    // Masa Play-Doh Reducida
    const R_INICIAL = 0.80;
    const geometry = new THREE.CylinderGeometry(R_INICIAL, R_INICIAL, 0.20, 90, 8, false);
    geometry.rotateX(Math.PI / 2);
    const originalPositions = geometry.attributes.position.clone();

    const material = new THREE.MeshStandardMaterial({
      color: 0xf97316,
      roughness: 0.8,
      metalness: 0.05,
      transparent: true,
      opacity: 0.90
    });

    const doughMesh = new THREE.Mesh(geometry, material);
    scene.add(doughMesh);

    // Deformación con límites seguros y margen
    function deformarMasaFirme(hit, brushRadius, fuerza, action) {
      if (!hit || fuerza <= 0 || action === "idle") return;

      const pos = geometry.attributes.position;
      const direccion = action === "pull" ? 1 : -1;
      const step = (action === "push" ? 0.022 : 0.032) * fuerza * direccion;

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const dist = Math.hypot(vx - hit.x, vy - hit.y);

        if (dist < brushRadius) {
          const factor = Math.exp(-(dist * dist) / (2 * (brushRadius * 0.45) * (brushRadius * 0.45))) * step;
          const radDist = Math.hypot(vx, vy) || 1;
          const nuevoR = radDist + factor;

          // Límite máximo 1.65 (Garantiza al menos 30% de espacio libre en los bordes)
          if (nuevoR >= 0.35 && nuevoR <= 1.65) {
            pos.setX(i, (vx / radDist) * nuevoR);
            pos.setY(i, (vy / radDist) * nuevoR);
          }
        }
      }
      pos.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    function resetDoughLocal() {
      const pos = geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        pos.setXYZ(i, originalPositions.getX(i), originalPositions.getY(i), originalPositions.getZ(i));
      }
      pos.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    // 2. MQTT
    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: USER_ID,
      clean: true
    });

    client.on("connect", () => {
      netStatus.className = "badge badge-ok";
      netStatus.innerText = "🟢 Conectado (" + USER_ID + ")";
      client.subscribe(TOPIC);
    });

    client.on("message", (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (data.rawUserId !== USER_ID && data.hitPos) {
          deformarMasaFirme(data.hitPos, data.action === "push" ? 0.32 : 0.48, data.force, data.action);
        }
      } catch (e) {}
    });

    // 3. MediaPipe
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],[0,17]
    ];

    function clasificarGesto(lm) {
      const wrist = lm[0];
      const palmSize = Math.hypot(wrist.x - lm[9].x, wrist.y - lm[9].y) || 0.1;

      const isExtended = (tip, pip) => {
        return Math.hypot(lm[tip].x - wrist.x, lm[tip].y - wrist.y) >
               Math.hypot(lm[pip].x - wrist.x, lm[pip].y - wrist.y);
      };

      const indexExt = isExtended(8, 6);
      const middleExt = isExtended(12, 10);
      const ringExt = isExtended(16, 14);
      const pinkyExt = isExtended(20, 18);

      const distThumbIndex = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / palmSize;

      if (distThumbIndex < 0.32) {
        return {
          action: "pull",
          label: "🤏 Pinza (Jalar)",
          point: { x: (lm[4].x + lm[8].x) / 2, y: (lm[4].y + lm[8].y) / 2 },
          force: 1.0
        };
      }

      if (indexExt && !middleExt && !ringExt && !pinkyExt) {
        return {
          action: "push",
          label: "☝️ Puntazo (Hundir)",
          point: { x: lm[8].x, y: lm[8].y },
          force: 0.8
        };
      }

      return { action: "idle", label: "✋ Reposo", point: { x: lm[9].x, y: lm[9].y }, force: 0.0 };
    }

    let lastDeformTime = [0, 0];

    function onResults(results) {
      skCtx.save();
      skCtx.clearRect(0, 0, skCanvas.width, skCanvas.height);

      const count = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;
      const now = Date.now();

      for (let h = 0; h < 2; h++) {
        const lbl = document.getElementById("labelH" + h);
        const gst = document.getElementById("gestureH" + h);
        if (h >= count) {
          lbl.innerText = "Buscando...";
          gst.className = "gesture-tag tag-idle";
          gst.innerText = "Inactiva";
        }
      }

      if (count > 0) {
        for (let h = 0; h < count; h++) {
          const lm = results.multiHandLandmarks[h];
          const gesto = clasificarGesto(lm);

          const lbl = document.getElementById("labelH" + h);
          const gst = document.getElementById("gestureH" + h);
          lbl.innerText = "Activa";
          gst.innerText = gesto.label;
          gst.className = "gesture-tag " + (gesto.action === "push" ? "tag-push" : gesto.action === "pull" ? "tag-pull" : "tag-idle");

          // Esqueleto
          skCtx.strokeStyle = gesto.action === "push" ? "#ef4444" : gesto.action === "pull" ? "#38bdf8" : "#64748b";
          skCtx.lineWidth = 3;
          for (const [s, e] of HAND_CONNECTIONS) {
            skCtx.beginPath();
            skCtx.moveTo(lm[s].x * skCanvas.width, lm[s].y * skCanvas.height);
            skCtx.lineTo(lm[e].x * skCanvas.width, lm[e].y * skCanvas.height);
            skCtx.stroke();
          }

          skCtx.beginPath();
          skCtx.arc(gesto.point.x * skCanvas.width, gesto.point.y * skCanvas.height, 8, 0, 2 * Math.PI);
          skCtx.fillStyle = gesto.action === "push" ? "#ef4444" : gesto.action === "pull" ? "#38bdf8" : "#94a3b8";
          skCtx.fill();

          // Mapeo 3D proporcional al nuevo campo de visión (Z = 8.5)
          const hitPos3D = {
            x: Number((-(gesto.point.x - 0.5) * 4.6).toFixed(3)),
            y: Number((-(gesto.point.y - 0.5) * 5.4).toFixed(3)),
            z: 0.1
          };

          if (gesto.action !== "idle" && (now - lastDeformTime[h] > 100)) {
            lastDeformTime[h] = now;
            deformarMasaFirme(hitPos3D, gesto.action === "push" ? 0.32 : 0.48, gesto.force, gesto.action);

            if (client.connected) {
              client.publish(TOPIC, JSON.stringify({
                id: `${USER_ID}_h${h}`,
                rawUserId: USER_ID,
                action: gesto.action,
                label: gesto.label,
                hitPos: hitPos3D,
                force: gesto.force
              }));
            }
          }
        }
      }

      skCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const cameraFeed = new Camera(videoElement, {
      onFrame: async () => {
        skCanvas.width = videoElement.videoWidth;
        skCanvas.height = videoElement.videoHeight;
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    cameraFeed.start();

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });
  </script>
</body>
</html>
