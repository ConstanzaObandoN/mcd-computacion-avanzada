<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DOM Play-Doh - Pantalla Central</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0f19; color: white; font-family: system-ui, -apple-system, sans-serif; }
    
    #panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h3 { margin: 0 0 6px 0; font-size: 16px; color: #f97316; }
    .stat { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .stat strong { color: #38bdf8; }
    
    #userActivityList {
      margin-top: 10px;
      background: #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid #334155;
    }
    .user-item { font-size: 12px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
    .badge-act { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .act-push { background: #dc2626; color: white; }
    .act-pull { background: #2563eb; color: white; }
    .act-idle { background: #475569; color: #cbd5e1; }

    .btn-reset {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }
    .btn-reset:hover { background: #dc2626; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="panel">
    <h3>🎨 Escultura Play-Doh Colectiva</h3>
    <div class="stat">Manos activas conectadas: <strong id="handCount">0</strong></div>
    
    <div style="margin-top:8px; font-size:12px; font-weight:bold; color:#cbd5e1;">Telemetría de colaboradores:</div>
    <div id="userActivityList">
      <div style="color:#64748b; font-size:11px;">Esperando colaboradores...</div>
    </div>

    <button class="btn-reset" onclick="resetSphere()">🔄 Nueva Bola de Masa</button>
  </div>

  <script>
    // 1. Escena y Cámara Orbit
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const lightFront = new THREE.DirectionalLight(0xfff7ed, 1.4);
    lightFront.position.set(4, 6, 6);
    scene.add(lightFront);

    const lightBack = new THREE.DirectionalLight(0x38bdf8, 0.6);
    lightBack.position.set(-4, -4, -3);
    scene.add(lightBack);

    // 2. Esfera Play-Doh
    const RADIUS = 1.6;
    const geometry = new THREE.SphereGeometry(RADIUS, 120, 120);
    const originalPositions = geometry.attributes.position.clone();

    const material = new THREE.MeshStandardMaterial({
      color: 0xf97316,
      roughness: 0.8,
      metalness: 0.05,
      wireframe: false
    });

    const sphereMesh = new THREE.Mesh(geometry, material);
    scene.add(sphereMesh);

    // Punteros 3D para cada mano
    const handPointers = new Map();

    function getOrCreatePointer(id) {
      if (!handPointers.has(id)) {
        const pGeo = new THREE.SphereGeometry(0.07, 16, 16);
        const pMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.85 });
        const pMesh = new THREE.Mesh(pGeo, pMat);
        scene.add(pMesh);
        handPointers.set(id, { mesh: pMesh, lastSeen: Date.now(), action: "idle", label: "Reposo" });
      }
      const ptr = handPointers.get(id);
      ptr.lastSeen = Date.now();
      return ptr;
    }

    // 3. Deformación Plástica Permanente
    function deformarMasa(hit, brushRadius, fuerza, action) {
      if (!hit || fuerza <= 0 || action === "idle") return;
      
      const pos = geometry.attributes.position;
      const direccion = action === "pull" ? 1 : -1; // Pull estira (+), Push hunde (-)
      const factorDesplazamiento = (action === "push" ? 0.05 : 0.06) * fuerza * direccion;

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);

        const dist = Math.hypot(vx - hit.x, vy - hit.y, vz - hit.z);

        if (dist < brushRadius) {
          const intensidad = Math.exp(-(dist * dist) / (2 * (brushRadius * 0.4) * (brushRadius * 0.4)));
          const delta = factorDesplazamiento * intensidad;

          const norma = Math.hypot(vx, vy, vz) || 1;
          pos.setXYZ(i, vx + (vx / norma) * delta, vy + (vy / norma) * delta, vz + (vz / norma) * delta);
        }
      }

      pos.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    // 4. MQTT EMQX
    const handCountEl = document.getElementById("handCount");
    const activityListEl = document.getElementById("userActivityList");
    const TOPIC = "mcd/dom/shared_mesh";

    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: "host_screen_" + Math.random().toString(16).substring(2, 6),
      clean: true
    });

    client.on("connect", () => {
      client.subscribe(TOPIC);
    });

    client.on("message", (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (data.hitPos) {
          const ptr = getOrCreatePointer(data.id);
          ptr.action = data.action;
          ptr.label = data.label;
          ptr.mesh.position.set(data.hitPos.x, data.hitPos.y, 1.62);

          // Feedback de color en el puntero 3D
          if (data.action === "push") {
            ptr.mesh.material.color.setHex(0xef4444); // Rojo para hundir
            ptr.mesh.scale.set(1.3, 1.3, 1.3);
            deformarMasa(data.hitPos, data.radius || 0.45, data.force, "push");
          } else if (data.action === "pull") {
            ptr.mesh.material.color.setHex(0x38bdf8); // Celeste/azul para estirar
            ptr.mesh.scale.set(1.4, 1.4, 1.4);
            deformarMasa(data.hitPos, data.radius || 0.65, data.force, "pull");
          } else {
            ptr.mesh.material.color.setHex(0x64748b); // Gris en reposo
            ptr.mesh.scale.set(0.9, 0.9, 0.9);
          }
        }
      } catch (e) {
        console.error(e);
      }
    });

    // Actualizar Lista de Telemetría en Pantalla
    function actualizarListaUI() {
      const now = Date.now();
      let html = "";
      
      for (const [id, ptr] of handPointers.entries()) {
        if (now - ptr.lastSeen > 2500) {
          scene.remove(ptr.mesh);
          handPointers.delete(id);
        } else {
          const badgeClass = ptr.action === "push" ? "act-push" : ptr.action === "pull" ? "act-pull" : "act-idle";
          const actionText = ptr.action === "push" ? "👇 Hundiendo" : ptr.action === "pull" ? "☝️ Estirando" : "✋ Reposo";
          html += `
            <div class="user-item">
              <span><strong>${id}</strong></span>
              <span class="badge-act ${badgeClass}">${actionText}</span>
            </div>
          `;
        }
      }

      handCountEl.innerText = handPointers.size;
      activityListEl.innerHTML = html || `<div style="color:#64748b; font-size:11px;">Esperando colaboradores...</div>`;
    }

    setInterval(actualizarListaUI, 300);

    function resetSphere() {
      const pos = geometry.attributes.position;
      const orig = originalPositions;
      for (let i = 0; i < pos.count; i++) {
        pos.setXYZ(i, orig.getX(i), orig.getY(i), orig.getZ(i));
      }
      pos.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
