<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DOM Play-Doh: Desafío de la Estrella</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0f19; color: white; font-family: system-ui, sans-serif; }
    #panel {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px);
      padding: 16px 20px; border-radius: 12px; border: 1px solid #334155; width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h3 { margin: 0 0 6px 0; font-size: 16px; color: #f97316; }
    .stat { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .stat strong { color: #38bdf8; }
    
    .match-bar-container { width: 100%; height: 12px; background: #334155; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    .match-bar-fill { height: 100%; width: 0%; background: #22c55e; transition: width 0.3s; }
    
    #userActivityList {
      margin-top: 10px; background: #1e293b; border-radius: 8px; padding: 8px 10px;
      max-height: 100px; overflow-y: auto; border: 1px solid #334155;
    }
    .user-item { font-size: 11px; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .badge-act { font-size: 9px; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
    .act-push { background: #dc2626; color: white; }
    .act-pull { background: #2563eb; color: white; }
    .act-idle { background: #475569; color: #cbd5e1; }

    .btn-reset {
      background: #ef4444; color: white; border: none; padding: 8px 12px;
      border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%;
    }
    .btn-reset:hover { background: #dc2626; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="panel">
    <h3>⭐ Desafío: Modela la Estrella</h3>
    <div class="stat">Objetivo: <strong>Estira las 5 puntas</strong></div>
    <div class="stat">Coincidencia de forma: <strong id="lblMatch">0%</strong></div>
    <div class="match-bar-container">
      <div id="barMatch" class="match-bar-fill"></div>
    </div>
    
    <div style="margin-top:8px; font-size:11px; font-weight:bold; color:#cbd5e1;">Colaboradores:</div>
    <div id="userActivityList">
      <div style="color:#64748b; font-size:11px;">Esperando manos...</div>
    </div>

    <button class="btn-reset" onclick="resetDough()">🔄 Reiniciar Masa</button>
  </div>

  <script>
    // 1. Escena y Cámara con Margen
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const light = new THREE.DirectionalLight(0xfff7ed, 1.3);
    light.position.set(3, 5, 4);
    scene.add(light);

    // 2. Silueta Estrella Escala Reducida
    const points = [];
    for (let i = 0; i <= 150; i++) {
      const theta = (i / 150) * Math.PI * 2;
      const r = 0.95 + 0.45 * Math.cos(5 * theta);
      points.push(new THREE.Vector3(r * Math.cos(theta), r * Math.sin(theta), -0.05));
    }
    const starGeo = new THREE.BufferGeometry().setFromPoints(points);
    const starMat = new THREE.LineDashedMaterial({ color: 0x38bdf8, dashSize: 0.08, gapSize: 0.04, linewidth: 2 });
    const starLine = new THREE.Line(starGeo, starMat);
    starLine.computeLineDistances();
    scene.add(starLine);

    // 3. Masa Inicial Reducida
    const R_INICIAL = 0.80;
    const geometry = new THREE.CylinderGeometry(R_INICIAL, R_INICIAL, 0.20, 90, 8, false);
    geometry.rotateX(Math.PI / 2);
    const originalPositions = geometry.attributes.position.clone();

    const material = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.8, metalness: 0.05 });
    const doughMesh = new THREE.Mesh(geometry, material);
    scene.add(doughMesh);

    // Punteros
    const handPointers = new Map();
    function getOrCreatePointer(id) {
      if (!handPointers.has(id)) {
        const pGeo = new THREE.SphereGeometry(0.07, 16, 16);
        const pMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.85 });
        const pMesh = new THREE.Mesh(pGeo, pMat);
        scene.add(pMesh);
        handPointers.set(id, { mesh: pMesh, lastSeen: Date.now(), action: "idle" });
      }
      const ptr = handPointers.get(id);
      ptr.lastSeen = Date.now();
      return ptr;
    }

    // 4. Deformación idéntica al celular
    function deformarPlano(hit, brushRadius, fuerza, action) {
      if (!hit || fuerza <= 0 || action === "idle") return;

      const pos = geometry.attributes.position;
      const direccion = action === "pull" ? 1 : -1;
      const step = (action === "push" ? 0.022 : 0.032) * fuerza * direccion;

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const dist = Math.hypot(vx - hit.x, vy - hit.y);

        if (dist < brushRadius) {
          const factor = Math.exp(-(dist * dist) / (2 * (brushRadius * 0.45) * (brushRadius * 0.45))) * step;
          const radDist = Math.hypot(vx, vy) || 1;
          const nuevoR = radDist + factor;

          if (nuevoR >= 0.35 && nuevoR <= 1.65) {
            pos.setX(i, (vx / radDist) * nuevoR);
            pos.setY(i, (vy / radDist) * nuevoR);
          }
        }
      }

      pos.needsUpdate = true;
      geometry.computeVertexNormals();
      calcularScore();
    }

    function calcularScore() {
      const pos = geometry.attributes.position;
      let totalDiff = 0;
      let samples = 0;

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const rActual = Math.hypot(x, y);

        if (rActual > 0.55) {
          const theta = Math.atan2(y, x);
          const rTarget = 0.95 + 0.45 * Math.cos(5 * theta);
          totalDiff += Math.abs(rActual - rTarget);
          samples++;
        }
      }

      const errorMedio = samples > 0 ? totalDiff / samples : 1;
      const matchPct = Math.max(0, Math.min(100, Math.round((1 - errorMedio / 0.55) * 100)));

      document.getElementById("lblMatch").innerText = matchPct + "%";
      document.getElementById("barMatch").style.width = matchPct + "%";
    }

    // 5. MQTT
    const TOPIC = "mcd/dom/shared_mesh";
    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: "host_star_" + Math.random().toString(16).substring(2, 6),
      clean: true
    });

    client.on("connect", () => client.subscribe(TOPIC));

    client.on("message", (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (data.hitPos) {
          const ptr = getOrCreatePointer(data.id);
          ptr.action = data.action;
          ptr.mesh.position.set(data.hitPos.x, data.hitPos.y, 0.15);

          if (data.action === "push") {
            ptr.mesh.material.color.setHex(0xef4444);
            ptr.mesh.scale.set(1.3, 1.3, 1.3);
            deformarPlano(data.hitPos, 0.32, data.force, "push");
          } else if (data.action === "pull") {
            ptr.mesh.material.color.setHex(0x38bdf8);
            ptr.mesh.scale.set(1.4, 1.4, 1.4);
            deformarPlano(data.hitPos, 0.48, data.force, "pull");
          } else {
            ptr.mesh.material.color.setHex(0x64748b);
            ptr.mesh.scale.set(0.9, 0.9, 0.9);
          }
        }
      } catch (e) {}
    });

    function resetDough() {
      const pos = geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        pos.setXYZ(i, originalPositions.getX(i), originalPositions.getY(i), originalPositions.getZ(i));
      }
      pos.needsUpdate = true;
      geometry.computeVertexNormals();
      calcularScore();
    }

    function animate() {
      requestAnimationFrame(animate);
      
      const now = Date.now();
      let html = "";
      for (const [id, ptr] of handPointers.entries()) {
        if (now - ptr.lastSeen > 2500) {
          scene.remove(ptr.mesh);
          handPointers.delete(id);
        } else {
          const actClass = ptr.action === "push" ? "act-push" : ptr.action === "pull" ? "act-pull" : "act-idle";
          const actTxt = ptr.action === "push" ? "👇 Hundiendo" : ptr.action === "pull" ? "☝️ Estirando" : "✋ Reposo";
          html += `<div class="user-item"><span><strong>${id}</strong></span><span class="badge-act ${actClass}">${actTxt}</span></div>`;
        }
      }
      document.getElementById("userActivityList").innerHTML = html || `<div style="color:#64748b; font-size:11px;">Esperando manos...</div>`;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
