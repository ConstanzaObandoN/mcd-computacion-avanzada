<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DOM Play-Doh: Gran Carrera de Escultura</title>
  <style>
    body { margin: 0; overflow: hidden; background: #080c14; color: white; font-family: system-ui, -apple-system, sans-serif; }
    
    #panel {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(10px);
      padding: 18px 22px; border-radius: 14px; border: 1px solid #334155; width: 360px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    h2 { margin: 0 0 6px 0; font-size: 18px; color: #f97316; display: flex; align-items: center; gap: 8px; }
    .stat { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .stat strong { color: #38bdf8; }

    .btn-start {
      background: #22c55e; color: #022c22; border: none; padding: 10px 14px;
      border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer;
      margin-top: 12px; width: 100%; transition: all 0.2s;
    }
    .btn-start:hover { background: #16a34a; color: white; }
    .btn-reset {
      background: #ef4444; color: white; border: none; padding: 8px 12px;
      border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; width: 100%;
    }

    /* Leaderboard de Carrera */
    #leaderboard { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
    .racer-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px;
    }
    .racer-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .racer-name { font-weight: bold; color: #f1f5f9; }
    .racer-lvl { color: #f59e0b; font-weight: bold; }
    
    .track-bg { width: 100%; height: 12px; background: #0f172a; border-radius: 6px; overflow: hidden; position: relative; }
    .track-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #22c55e); transition: width 0.25s ease-out; }
    .track-mark { position: absolute; left: 70%; top: 0; bottom: 0; width: 2px; background: #facc15; }

    #countdownOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100;
      display: none; justify-content: center; align-items: center; flex-direction: column;
    }
    #countdownText { font-size: 90px; font-weight: 900; color: #f97316; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="countdownOverlay">
    <div id="countdownText">3</div>
    <div style="font-size: 20px; color:#cbd5e1; margin-top: 10px;">¡Preparen las manos!</div>
  </div>

  <div id="panel">
    <h2>🏆 Gran Carrera Play-Doh</h2>
    <div class="stat">Meta: <strong>Superar el 70% para avanzar de nivel</strong></div>
    <div class="stat">Escultores conectados: <strong id="userCount">0</strong></div>
    
    <button class="btn-start" id="btnStartGame" onclick="iniciarCarrera()">🏁 Iniciar Carrera para Todos</button>
    <button class="btn-reset" onclick="reiniciarTodo()">🔄 Reiniciar Juego</button>

    <div style="margin-top: 12px; font-size: 12px; font-weight: bold; color: #94a3b8;">Progreso de la Carrera:</div>
    <div id="leaderboard">
      <div style="color:#64748b; font-size: 11px;">Esperando que se conecten jugadores...</div>
    </div>
  </div>

  <script>
    // 1. Escena Three.js de exhibición de formas
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dirLight = new THREE.DirectionalLight(0xffedd5, 1.2);
    dirLight.position.set(4, 5, 5);
    scene.add(dirLight);

    // Representación 3D central de exhibición
    const siluetasGroup = new THREE.Group();
    scene.add(siluetasGroup);

    // Ecuaciones de los 3 niveles
    function getRadiusForLevel(lvl, theta) {
      if (lvl === 1) { // Corazón suave redondeado
        const t = theta + Math.PI / 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        return (Math.hypot(x, y) / 16) * 1.05;
      } else if (lvl === 2) { // Nube
        return 0.95 + 0.30 * Math.sin(3 * theta) + 0.15 * Math.cos(6 * theta);
      } else { // Estrella 5 puntas
        return 0.95 + 0.45 * Math.cos(5 * theta);
      }
    }

    function renderPreviewShape(lvl) {
      siluetasGroup.clear();
      const pts = [];
      for (let i = 0; i <= 180; i++) {
        const theta = (i / 180) * Math.PI * 2;
        const r = getRadiusForLevel(lvl, theta);
        pts.push(new THREE.Vector3(r * Math.cos(theta), r * Math.sin(theta), 0));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 3 });
      const line = new THREE.Line(geo, mat);
      siluetasGroup.add(line);
    }
    renderPreviewShape(1);

    // 2. MQTT EMQX
    const TOPIC_TELEMETRY = "mcd/dom/telemetry";
    const TOPIC_CONTROL = "mcd/dom/game_control";

    const racers = new Map(); // id -> { name, level, match, lastSeen }

    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: "host_screen_" + Math.random().toString(16).substring(2, 6),
      clean: true
    });

    client.on("connect", () => {
      client.subscribe(TOPIC_TELEMETRY);
    });

    client.on("message", (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (topic === TOPIC_TELEMETRY) {
          racers.set(data.id, {
            name: data.id,
            level: data.level || 1,
            match: data.match || 0,
            lastSeen: Date.now()
          });
          actualizarLeaderboard();
        }
      } catch (e) {}
    });

    function iniciarCarrera() {
      const overlay = document.getElementById("countdownOverlay");
      const txt = document.getElementById("countdownText");
      overlay.style.display = "flex";

      let count = 3;
      txt.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          txt.innerText = count;
        } else if (count === 0) {
          txt.innerText = "¡MOLDEEN!";
          client.publish(TOPIC_CONTROL, JSON.stringify({ action: "START_GAME" }));
        } else {
          clearInterval(timer);
          overlay.style.display = "none";
        }
      }, 1000);
    }

    function reiniciarTodo() {
      client.publish(TOPIC_CONTROL, JSON.stringify({ action: "RESET_ALL" }));
      racers.clear();
      actualizarLeaderboard();
    }

    const leaderboardEl = document.getElementById("leaderboard");
    const userCountEl = document.getElementById("userCount");

    function actualizarLeaderboard() {
      const now = Date.now();
      // Eliminar inactivos tras 6s
      for (const [id, r] of racers.entries()) {
        if (now - r.lastSeen > 6000) racers.delete(id);
      }

      userCountEl.innerText = racers.size;

      // Ordenar por nivel descendente y luego por % match
      const ordenados = Array.from(racers.values()).sort((a, b) => {
        if (b.level !== a.level) return b.level - a.level;
        return b.match - a.match;
      });

      if (ordenados.length === 0) {
        leaderboardEl.innerHTML = `<div style="color:#64748b; font-size:11px;">Esperando que se conecten jugadores...</div>`;
        return;
      }

      let html = "";
      ordenados.forEach((r, idx) => {
        const nivelNombre = r.level === 1 ? "❤️ Corazón" : r.level === 2 ? "☁️ Nube" : r.level === 3 ? "⭐ Estrella" : "🏆 ¡GANADOR!";
        html += `
          <div class="racer-card">
            <div class="racer-header">
              <span class="racer-name">#${idx + 1} ${r.name}</span>
              <span class="racer-lvl">${nivelNombre} (${r.match}%)</span>
            </div>
            <div class="track-bg">
              <div class="track-mark"></div>
              <div class="track-fill" style="width: ${r.match}%;"></div>
            </div>
          </div>
        `;
      });

      leaderboardEl.innerHTML = html;
    }

    function animate() {
      requestAnimationFrame(animate);
      siluetasGroup.rotation.z += 0.002;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
