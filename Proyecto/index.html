<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Detector de Mano - MediaPipe</title>
  <style>
    body { margin: 0; background: #0f172a; color: white; font-family: system-ui, sans-serif; overflow: hidden; }
    
    #cameraView { position: relative; width: 100vw; height: 75vh; background: #000; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    
    #panelInfo {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 25vh;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid #334155;
      padding: 12px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }
    
    .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .badge { padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; }
    .badge-ok { background: #065f46; color: #34d399; }
    .badge-wait { background: #854d0e; color: #fde047; }
    
    .metric-box { display: flex; justify-content: space-around; background: #1e293b; padding: 8px; border-radius: 8px; font-size: 12px; }
    .metric-val { font-size: 16px; font-weight: bold; color: #38bdf8; }
  </style>

  <!-- Scripts oficiales de MediaPipe Hands (Procesamiento 100% local) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="cameraView">
    <video id="webcam" playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div id="panelInfo">
    <div class="status-row">
      <span>📡 Broker EMQX:</span>
      <span id="netStatus" class="badge badge-wait">Conectando...</span>
    </div>

    <div class="metric-box">
      <div>Mano detectada: <br><span id="lblDetect" class="metric-val" style="color:#ef4444;">NO</span></div>
      <div>Pellizco / Fuerza: <br><span id="lblPinch" class="metric-val">0%</span></div>
      <div>Posición X, Y: <br><span id="lblPos" class="metric-val">0.0, 0.0</span></div>
    </div>

    <div style="font-size:11px; color:#94a3b8; text-align:center;">
      Muestra tu mano frente a la cámara. Junta el pulgar y el índice para amasar.
    </div>
  </div>

  <script>
    const USER_ID = "hand_" + Math.random().toString(16).substring(2, 6);
    const TOPIC = "mcd/dom/shared_mesh";

    const videoElement = document.getElementById("webcam");
    const canvasElement = document.getElementById("outputCanvas");
    const canvasCtx = canvasElement.getContext("2d");

    const netStatus = document.getElementById("netStatus");
    const lblDetect = document.getElementById("lblDetect");
    const lblPinch = document.getElementById("lblPinch");
    const lblPos = document.getElementById("lblPos");

    // 1. Conexión MQTT a EMQX
    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: USER_ID,
      clean: true
    });

    client.on("connect", () => {
      netStatus.className = "badge badge-ok";
      netStatus.innerText = "🟢 Conectado (" + USER_ID + ")";
    });

    // Conexiones de los 21 puntos articulares de la mano
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],        // Pulgar
      [0,5],[5,6],[6,7],[7,8],        // Índice
      [5,9],[9,10],[10,11],[11,12],   // Medio
      [9,13],[13,14],[14,15],[15,16], // Anular
      [13,17],[17,18],[18,19],[19,20],[0,17] // Meñique y Palma
    ];

    // 2. Procesamiento visual en tiempo real con MediaPipe
    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        lblDetect.innerText = "SÍ";
        lblDetect.style.color = "#34d399";

        const landmarks = results.multiHandLandmarks[0];

        // A. Dibujar líneas de las articulaciones (esqueleto)
        canvasCtx.strokeStyle = "#0284c7";
        canvasCtx.lineWidth = 3;
        for (const [start, end] of HAND_CONNECTIONS) {
          const p1 = landmarks[start];
          const p2 = landmarks[end];
          canvasCtx.beginPath();
          canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
          canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
          canvasCtx.stroke();
        }

        // B. Dibujar los 21 puntos clave (nudillos y yemas)
        for (let i = 0; i < landmarks.length; i++) {
          const pt = landmarks[i];
          canvasCtx.beginPath();
          canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, (i === 4 || i === 8) ? 8 : 4, 0, 2 * Math.PI);
          canvasCtx.fillStyle = (i === 4 || i === 8) ? "#f97316" : "#38bdf8"; // Pulgar e índice en naranja
          canvasCtx.fill();
        }

        // C. Medir distancia de pellizco (Punto 4 = Pulgar, Punto 8 = Índice)
        const thumb = landmarks[4];
        const index = landmarks[8];
        const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y);

        // Mapeo: Si están muy juntos (<0.07) fuerza = 1.0 (100%), si se separan (>0.22) fuerza = 0
        const pinchForce = Math.max(0, Math.min(1, (0.22 - dist) / (0.22 - 0.07)));

        // Coordenada central de deformación (punto medio del pellizco)
        const pinchX = (thumb.x + index.x) / 2;
        const pinchY = (thumb.y + index.y) / 2;

        lblPinch.innerText = Math.round(pinchForce * 100) + "%";
        lblPos.innerText = `${pinchX.toFixed(2)}, ${pinchY.toFixed(2)}`;

        // D. Transmitir a EMQX
        if (client.connected) {
          client.publish(TOPIC, JSON.stringify({
            id: USER_ID,
            // Proyectamos las coordenadas normalizadas al espacio 3D de la esfera
            hitPos: {
              x: Number(((pinchX - 0.5) * 3.2).toFixed(3)),
              y: Number((-(pinchY - 0.5) * 3.2).toFixed(3)),
              z: 1.0
            },
            radius: 0.65,
            force: pinchForce > 0.15 ? pinchForce : 0,
            mode: "push"
          }));
        }
      } else {
        lblDetect.innerText = "NO";
        lblDetect.style.color = "#ef4444";
        lblPinch.innerText = "0%";
      }

      canvasCtx.restore();
    }

    // 3. Inicializar MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    // Iniciar cámara con CameraUtils
    const cameraFeed = new Camera(videoElement, {
      onFrame: async () => {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    cameraFeed.start().catch(err => {
      alert("Error al iniciar cámara: " + err);
    });
  </script>
</body>
</html>
