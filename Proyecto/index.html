<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrera de Destreza - Pantalla Central</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #fdfbf7;
      color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    #mainView {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.3s ease;
    }

    header {
      padding: 12px 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      position: absolute;
      top: 0;
      right: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border-bottom-left-radius: 12px;
      border-left: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 9px 15px;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
      transition: transform 0.1s, background 0.2s;
    }
    button:active { transform: scale(0.96); }
    .btn-start { background: #22c55e; color: white; }
    .btn-start:hover { background: #16a34a; }
    .btn-analytics { background: #6366f1; color: white; }
    .btn-export { background: #0ea5e9; color: white; }

    #trackContainer {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas#trackCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Panel Lateral de Analítica */
    #analyticsDrawer {
      width: 0;
      height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      overflow-y: auto;
      transition: width 0.3s ease;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 25px rgba(0,0,0,0.3);
    }
    #analyticsDrawer.open {
      width: 420px;
      padding: 24px 20px;
    }

    .drawer-title { font-size: 18px; font-weight: 800; color: #38bdf8; margin-bottom: 12px; }
    .stat-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
      font-size: 12px;
    }
    .stat-card h4 { margin: 0 0 6px 0; color: #facc15; font-size: 13px; }
    .log-box {
      max-height: 180px;
      overflow-y: auto;
      background: #0b0f19;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
    }

    #countdownOverlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 50;
    }
    #countText { font-size: 110px; font-weight: 900; color: #f97316; }
  </style>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="mainView">
    <div id="countdownOverlay">
      <div id="countText">3</div>
      <div style="font-size: 24px; color: white; font-weight: bold;">¡A sus marcas!</div>
    </div>

    <header>
      <button class="btn-start" onclick="iniciarCarrera()">🏁 Dar Salida</button>
      <button class="btn-analytics" onclick="toggleDrawer()">📊 Ver Análisis</button>
      <button class="btn-export" onclick="exportarCSV()">📥 Descargar CSV</button>
    </header>

    <div id="trackContainer">
      <canvas id="trackCanvas"></canvas>
    </div>
  </div>

  <div id="analyticsDrawer">
    <div class="drawer-title">📈 Telemetría Experimental</div>

    <div class="stat-card">
      <h4>Matriz Gestual Acumulada</h4>
      <div>Total Pinzas (Estirar): <strong id="totalPinches" style="color:#38bdf8;">0</strong></div>
      <div>Total Poking (Hundir): <strong id="totalPushes" style="color:#ef4444;">0</strong></div>
      <div>Ratio Pinza / Hundir: <strong id="ratioPinchPush">0.0</strong></div>
    </div>

    <div class="stat-card">
      <h4>Progreso de Corredores</h4>
      <div id="drawerRacersList">Esperando participantes...</div>
    </div>

    <div class="stat-card" style="flex:1;">
      <h4>Registro Cronológico</h4>
      <div class="log-box" id="eventLog"></div>
    </div>
  </div>

  <script>
    const TOPIC_TELEMETRY = "mcd/dom/telemetry";
    const TOPIC_GESTURES  = "mcd/dom/gestures_log";
    const TOPIC_CONTROL   = "mcd/dom/game_control";

    const racers = new Map();
    const telemetryHistory = [];

    let totalPinches = 0;
    let totalPushes = 0;

    const trackCanvas = document.getElementById("trackCanvas");
    const ctx = trackCanvas.getContext("2d");

    // Cargar Imágenes Personalizadas
    const bgImg = new Image();
    bgImg.src = "assets/pista.png";

    const runnerImg = new Image();
    runnerImg.src = "assets/runner.png";
//
    function resizeTrack() {
      trackCanvas.width = trackCanvas.clientWidth;
      trackCanvas.height = trackCanvas.clientHeight;
    }
    window.addEventListener("resize", resizeTrack);
    resizeTrack();

    // MQTT EMQX
    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: "host_screen_" + Math.random().toString(16).substring(2, 6),
      clean: true
    });

    client.on("connect", () => {
      client.subscribe([TOPIC_TELEMETRY, TOPIC_GESTURES]);
    });

    client.on("message", (topic, message) => {
      try {
        const data = JSON.parse(message.toString());

        if (topic === TOPIC_TELEMETRY) {
          if (!racers.has(data.id)) {
            racers.set(data.id, {
              id: data.id,
              color: data.color || "#3b82f6",
              level: data.level || 1,
              match: data.match || 0,
              lane: racers.size,
              pinches: 0,
              pushes: 0,
              lastSeen: Date.now()
            });
          }
          const r = racers.get(data.id);
          r.level = data.level;
          r.match = data.match;
          r.color = data.color || r.color;
          r.lastSeen = Date.now();
        }

        if (topic === TOPIC_GESTURES) {
          if (data.action === "pull") totalPinches++;
          if (data.action === "push") totalPushes++;

          if (racers.has(data.userId)) {
            const r = racers.get(data.userId);
            if (data.action === "pull") r.pinches++;
            if (data.action === "push") r.pushes++;
          }

          telemetryHistory.push({
            timestamp: new Date().toISOString(),
            userId: data.userId,
            color: data.color,
            level: data.level,
            action: data.action,
            match: data.match
          });

          const log = document.getElementById("eventLog");
          const item = document.createElement("div");
          item.innerText = `[${new Date().toLocaleTimeString()}] ${data.userId}: ${data.action} (L${data.level})`;
          log.prepend(item);

          actualizarMetricasUI();
        }
      } catch (e) {}
    });

    // Función para tintar dinámicamente runner.png con el color elegido
    const runnerColorCache = new Map();
    function getTintedRunner(color) {
      if (runnerColorCache.has(color)) return runnerColorCache.get(color);

      const offCanvas = document.createElement("canvas");
      offCanvas.width = runnerImg.width || 120;
      offCanvas.height = runnerImg.height || 120;
      const offCtx = offCanvas.getContext("2d");

      // Dibujar silueta original
      offCtx.drawImage(runnerImg, 0, 0, offCanvas.width, offCanvas.height);
      // Aplicar tinte del color
      offCtx.globalCompositeOperation = "source-in";
      offCtx.fillStyle = color;
      offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);

      runnerColorCache.set(color, offCanvas);
      return offCanvas;
    }

    // Bucle de Renderizado de la Pista
    function renderTrack() {
      const w = trackCanvas.width;
      const h = trackCanvas.height;

      // 1. Dibujar Imagen de Fondo de la Pista
      if (bgImg.complete && bgImg.naturalWidth > 0) {
        ctx.drawImage(bgImg, 0, 0, w, h);
      } else {
        ctx.fillStyle = "#fba94b";
        ctx.fillRect(0, 0, w, h);
      }

      // Parámetros geométricos alineados con pista.png:
      // La pista tiene 8 carriles en la franja inferior (aproximadamente desde el 38% del alto hasta el 100%)
      const topOffset = h * 0.38;
      const trackAreaH = h - topOffset;
      const numLanes = 8;
      const laneH = trackAreaH / numLanes;

      // Las 5 líneas de etapa en pista.png están distribuidas proporcionalmente
      // Salida: ~12.5% del ancho | Meta final: ~94.5% del ancho
      const startX = w * 0.02;
      const goalX = w * 0.945;
      const totalDist = goalX - startX;
      const stageDist = totalDist / 5;

      // 2. Dibujar Corredores usando runner.png
      let laneIdx = 0;
      for (const [id, r] of racers.entries()) {
        const assignedLane = laneIdx % numLanes;
        const laneCenterY = topOffset + (assignedLane + 0.5) * laneH;

        // Calcular posición X del corredor (Nivel 1..5 y avance de 0 a 70%)
        const completedStagesDist = (r.level - 1) * stageDist;
        const currentStageDist = (Math.min(r.match, 70) / 70) * stageDist;
        const runnerX = Math.min(goalX, startX + completedStagesDist + currentStageDist);

        const runnerSize = laneH * 0.85;
        const runnerY = laneCenterY - runnerSize / 2;

        if (runnerImg.complete && runnerImg.naturalWidth > 0) {
          const tinted = getTintedRunner(r.color);
          ctx.drawImage(tinted, runnerX - runnerSize * 0.4, runnerY, runnerSize, runnerSize);
        } else {
          // Fallback círculo si la imagen aún carga
          ctx.beginPath();
          ctx.arc(runnerX, laneCenterY, 14, 0, Math.PI * 2);
          ctx.fillStyle = r.color;
          ctx.fill();
        }

        // Nombre y porcentaje
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 11px system-ui";
        ctx.fillText(`${r.id} (L${r.level}: ${r.match}%)`, runnerX - 15, runnerY - 4);

        laneIdx++;
      }

      requestAnimationFrame(renderTrack);
    }

    bgImg.onload = () => requestAnimationFrame(renderTrack);
    runnerImg.onload = () => requestAnimationFrame(renderTrack);
    requestAnimationFrame(renderTrack);

    function toggleDrawer() {
      document.getElementById("analyticsDrawer").classList.toggle("open");
    }

    function actualizarMetricasUI() {
      document.getElementById("totalPinches").innerText = totalPinches;
      document.getElementById("totalPushes").innerText = totalPushes;
      const ratio = totalPushes > 0 ? (totalPinches / totalPushes).toFixed(2) : totalPinches;
      document.getElementById("ratioPinchPush").innerText = ratio;

      let html = "";
      for (const [id, r] of racers.entries()) {
        html += `<div><strong>${r.id}</strong> (<span style="color:${r.color}">●</span>): ${r.pinches} Pinzas | ${r.pushes} Poking | Nivel ${r.level}</div>`;
      }
      document.getElementById("drawerRacersList").innerHTML = html || "Esperando participantes...";
    }

    function iniciarCarrera() {
      const overlay = document.getElementById("countdownOverlay");
      const txt = document.getElementById("countText");
      overlay.style.display = "flex";

      let count = 3;
      txt.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          txt.innerText = count;
        } else if (count === 0) {
          txt.innerText = "¡MOLDEEN!";
          client.publish(TOPIC_CONTROL, JSON.stringify({ action: "START_RACE" }));
        } else {
          clearInterval(timer);
          overlay.style.display = "none";
        }
      }, 1000);
    }

    function exportarCSV() {
      if (telemetryHistory.length === 0) {
        alert("Aún no hay datos de telemetría registrados.");
        return;
      }
      let csvContent = "data:text/csv;charset=utf-8,Timestamp,UserId,Color,Level,Action,MatchPercent\n";
      telemetryHistory.forEach(row => {
        csvContent += `${row.timestamp},${row.userId},${row.color},${row.level},${row.action},${row.match}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `telemetria_carrera_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
