<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sculpt3D Colaborativo</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0f19; color: white; font-family: system-ui, -apple-system, sans-serif; }
    
    /* Barra Superior de Estado y Modo */
    #topBar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .badge { font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
    .badge-online { background: #065f46; color: #34d399; }

    /* Barra Inferior de Herramientas (Estilo Nomad / Sculpt3D) */
    #bottomBar {
      position: absolute;
      bottom: 12px;
      left: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px;
      border-radius: 16px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .tool-row { display: flex; gap: 8px; }
    .tool-btn {
      flex: 1;
      padding: 10px 4px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .tool-btn.active {
      background: #f97316;
      border-color: #f97316;
      color: white;
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.4);
    }
    .tool-btn.camera-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
    }

    .slider-row {
      display: grid;
      grid-template-columns: 70px 1fr;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #cbd5e1;
    }
    input[type=range] { width: 100%; accent-color: #f97316; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <!-- Barra Superior -->
  <div id="topBar">
    <div style="font-weight:700; font-size:14px; color:#f97316;">🎨 Sculpt3D Móvil</div>
    <div id="statusBadge" class="badge badge-online">🟢 Conectado</div>
  </div>

  <!-- Barra de Herramientas -->
  <div id="bottomBar">
    <div class="tool-row">
      <button class="tool-btn active" id="btnPush" onclick="setMode('push')">👇 Hundir</button>
      <button class="tool-btn" id="btnPull" onclick="setMode('pull')">☝️ Jalar</button>
      <button class="tool-btn camera-btn" id="btnOrbit" onclick="setMode('orbit')">🔄 Rotar</button>
    </div>
    
    <div class="slider-row">
      <span>Radio Pincel</span>
      <input type="range" id="brushRadius" min="0.2" max="1.2" step="0.05" value="0.55">
    </div>
  </div>

  <script>
    const USER_ID = "cel_" + Math.random().toString(16).substring(2, 6);
    const TOPIC = "mcd/dom/shared_mesh";

    // 1. Escena Three.js y Cámara Móvil
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Controles Orbit para rotar en modo cámara
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enabled = false; // Desactivado por defecto (se activa en modo 'orbit')

    // Luces
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const frontLight = new THREE.DirectionalLight(0xfff7ed, 1.4);
    frontLight.position.set(4, 6, 6);
    scene.add(frontLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.6);
    rimLight.position.set(-4, -4, -3);
    scene.add(rimLight);

    // 2. Esfera de Escultura Local (Sincronizada con el PC)
    const RADIUS = 1.6;
    const geometry = new THREE.SphereGeometry(RADIUS, 90, 90);
    const material = new THREE.MeshStandardMaterial({
      color: 0xf97316,
      roughness: 0.8,
      metalness: 0.05,
      wireframe: false
    });

    const sphereMesh = new THREE.Mesh(geometry, material);
    scene.add(sphereMesh);

    // 3. Conexión MQTT
    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: USER_ID,
      clean: true
    });

    client.on("connect", () => {
      client.subscribe(TOPIC);
    });

    // Recibir deformaciones aplicadas por otros usuarios o el PC
    client.on("message", (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (data.id !== USER_ID) {
          aplicarDeformacionPunto(data.hitPos, data.radius || 0.55, data.force || 1.0, data.mode || "push");
        }
      } catch (e) {}
    });

    // 4. Lógica de Esculpido con Raycasting
    const raycaster = new THREE.Raycaster();
    const touchCoord = new THREE.Vector2();
    let currentMode = "push"; // "push", "pull", "orbit"
    let isTouching = false;

    function setMode(mode) {
      currentMode = mode;
      document.getElementById("btnPush").className = "tool-btn " + (mode === "push" ? "active" : "");
      document.getElementById("btnPull").className = "tool-btn " + (mode === "pull" ? "active" : "");
      document.getElementById("btnOrbit").className = "tool-btn camera-btn " + (mode === "orbit" ? "active" : "");
      
      controls.enabled = (mode === "orbit");
    }

    function aplicarDeformacionPunto(hitPoint, brushRadius, fuerza, modo) {
      if (!hitPoint) return;
      const pos = geometry.attributes.position;
      const direccion = modo === "pull" ? 1 : -1;
      const desplazamientoBase = 0.08 * fuerza * direccion;

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);

        const dist = Math.hypot(vx - hitPoint.x, vy - hitPoint.y, vz - hitPoint.z);

        if (dist < brushRadius) {
          const intensidad = Math.exp(-(dist * dist) / (2 * (brushRadius * 0.45) * (brushRadius * 0.45)));
          const delta = desplazamientoBase * intensidad;

          const norma = Math.hypot(vx, vy, vz) || 1;
          pos.setXYZ(i, vx + (vx / norma) * delta, vy + (vy / norma) * delta, vz + (vz / norma) * delta);
        }
      }

      pos.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    function procesarTouchSculpt(e) {
      if (currentMode === "orbit") return;

      const touch = e.touches ? e.touches[0] : e;
      touchCoord.x = (touch.clientX / window.innerWidth) * 2 - 1;
      touchCoord.y = -(touch.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(touchCoord, camera);
      const intersects = raycaster.intersectObject(sphereMesh);

      if (intersects.length > 0) {
        const hit = intersects[0].point;
        const radius = parseFloat(document.getElementById("brushRadius").value);

        // 1. Deformar en la pantalla del celular de inmediato
        aplicarDeformacionPunto(hit, radius, 1.0, currentMode);

        // 2. Enviar vector 3D al PC y a los demás teléfonos conectados
        if (client.connected) {
          client.publish(TOPIC, JSON.stringify({
            id: USER_ID,
            hitPos: { x: Number(hit.x.toFixed(3)), y: Number(hit.y.toFixed(3)), z: Number(hit.z.toFixed(3)) },
            radius: radius,
            force: 1.0,
            mode: currentMode
          }));
        }
      }
    }

    // Eventos táctiles
    window.addEventListener("touchstart", (e) => {
      // Ignorar si se toca la barra superior o el menú inferior
      if (e.target.closest("#topBar") || e.target.closest("#bottomBar")) return;
      isTouching = true;
      procesarTouchSculpt(e);
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      if (!isTouching || currentMode === "orbit") return;
      procesarTouchSculpt(e);
    }, { passive: false });

    window.addEventListener("touchend", () => { isTouching = false; });

    // 5. Bucle de Render
    function animate() {
      requestAnimationFrame(animate);
      if (controls.enabled) controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
