<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escultor Play-Doh</title>
  <style>
    body { margin: 0; background: #0f172a; color: white; font-family: system-ui, sans-serif; text-align: center; }
    .status-bar { padding: 8px; font-weight: bold; background: #059669; font-size: 13px; }
    
    .mode-selector { display: flex; justify-content: center; gap: 10px; margin: 12px 0 6px 0; }
    .mode-btn { flex: 1; max-width: 140px; padding: 10px; border-radius: 8px; border: 2px solid #475569; background: #1e293b; color: white; font-weight: bold; cursor: pointer; }
    .mode-btn.active { border-color: #f97316; background: #f97316; }

    #touchArea { width: 90vw; height: 50vh; margin: 10px auto; background: #1e293b; border: 2px dashed #475569; border-radius: 14px; display: flex; align-items: center; justify-content: center; position: relative; touch-action: none; }
    #touchPoint { width: 40px; height: 40px; background: rgba(249, 115, 22, 0.7); border: 2px solid #fff; border-radius: 50%; position: absolute; display: none; transform: translate(-50%, -50%); pointer-events: none; }
  </style>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div class="status-bar" id="statusBar">🟢 Conectado al Escultor Play-Doh</div>

  <div class="mode-selector">
    <button class="mode-btn active" id="btnPush" onclick="setMode('push')">👇 Hundir</button>
    <button class="mode-btn" id="btnPull" onclick="setMode('pull')">☝️ Jalar Masa</button>
  </div>

  <div id="touchArea">
    <div id="touchPoint"></div>
    <span id="guide" style="color:#94a3b8; font-size:14px;">Mueve el dedo aquí para esculpir la bola</span>
  </div>

  <div style="font-size:12px; color:#64748b;">Conectado a la esfera central en vivo</div>

  <script>
    const USER_ID = "clay_" + Math.random().toString(16).substring(2, 6);
    let currentMode = "push";

    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: USER_ID,
      clean: true
    });

    function setMode(mode) {
      currentMode = mode;
      document.getElementById("btnPush").className = "mode-btn " + (mode === "push" ? "active" : "");
      document.getElementById("btnPull").className = "mode-btn " + (mode === "pull" ? "active" : "");
    }

    const touchArea = document.getElementById("touchArea");
    const touchPoint = document.getElementById("touchPoint");
    const guide = document.getElementById("guide");

    function esculpir(e) {
      e.preventDefault();
      const rect = touchArea.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      
      const x = touch.clientX - rect.left;
      const y = touch.clientY - rect.top;

      if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
        touchPoint.style.display = "block";
        touchPoint.style.left = x + "px";
        touchPoint.style.top = y + "px";
        guide.style.display = "none";

        if (client.connected) {
          client.publish("mcd/dom/shared_mesh", JSON.stringify({
            id: USER_ID,
            x: Number((x / rect.width).toFixed(2)),
            y: Number((y / rect.height).toFixed(2)),
            force: 1.0,
            mode: currentMode
          }));
        }
      }
    }

    touchArea.addEventListener("touchstart", esculpir, { passive: false });
    touchArea.addEventListener("touchmove", esculpir, { passive: false });
    touchArea.addEventListener("touchend", () => {
      touchPoint.style.display = "none";
    });
  </script>
</body>
</html>
