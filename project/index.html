<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DOM Visualizer - Test</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0f19; color: white; font-family: monospace; }
    #panel { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(15,23,42,0.9); padding: 14px 18px; border-radius: 8px; border: 1px solid #334155; width: 320px; }
    .log-line { font-size: 11px; color: #38bdf8; margin-top: 3px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="panel">
    <h3 style="margin:0 0 8px 0; font-size:14px;">📡 Monitor DOM en Vivo</h3>
    <div>Estado Broker: <strong id="netStatus" style="color:#fbbf24;">Conectando...</strong></div>
    <div>Usuarios activos: <strong id="userCount" style="color:#34d399;">0</strong></div>
    <div style="margin-top:10px; font-weight:bold;">Últimos paquetes:</div>
    <div id="logBox" style="max-height:80px; overflow:hidden;"></div>
  </div>

  <script>
    // 1. Escena Three.js
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 4.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const light = new THREE.DirectionalLight(0x38bdf8, 1.5);
    light.position.set(0, 2, 4);
    scene.add(light);

    // Malla Viscoelástica
    const geometry = new THREE.PlaneGeometry(3.6, 3.6, 60, 60);
    const originalPos = geometry.attributes.position.clone();
    
    const material = new THREE.MeshStandardMaterial({
      color: 0x0284c7,
      wireframe: true,
      emissive: 0x0369a1,
      emissiveIntensity: 0.5
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // 2. Estado de Deformaciones
    const activeTouches = new Map();
    const netStatus = document.getElementById("netStatus");
    const userCount = document.getElementById("userCount");
    const logBox = document.getElementById("logBox");

    // 3. Conexión MQTT
    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: "host_" + Math.random().toString(16).substring(2, 6),
      clean: true
    });

    const TOPIC = "mcd/dom/shared_mesh";

    client.on("connect", () => {
      netStatus.innerText = "🟢 Conectado";
      netStatus.style.color = "#34d399";
      client.subscribe(TOPIC);
    });

    client.on("message", (topic, message) => {
      const data = JSON.parse(message.toString());
      
      activeTouches.set(data.id, {
        x: (data.x - 0.5) * 3.6,
        y: -(data.y - 0.5) * 3.6,
        force: data.force || 0.8,
        lastSeen: Date.now()
      });

      logBox.innerHTML = `<div class="log-line">${data.id} -> X:${data.x} Y:${data.y} F:${data.force}</div>` + logBox.innerHTML;
    });

    // 4. Bucle Físico
    function animate() {
      requestAnimationFrame(animate);

      const pos = geometry.attributes.position;
      const now = Date.now();

      for (const [id, u] of activeTouches.entries()) {
        if (now - u.lastSeen > 2000) activeTouches.delete(id);
      }
      userCount.innerText = activeTouches.size;

      for (let i = 0; i < pos.count; i++) {
        const ox = originalPos.getX(i);
        const oy = originalPos.getY(i);
        const oz = originalPos.getZ(i);

        let targetZ = oz;

        activeTouches.forEach(u => {
          const dist = Math.hypot(ox - u.x, oy - u.y);
          const sigma = 0.5;
          const displacement = (u.force * 1.5) * Math.exp(-(dist * dist) / (2 * sigma * sigma));
          targetZ -= displacement;
        });

        const currentZ = pos.getZ(i);
        pos.setZ(i, currentZ + (targetZ - currentZ) * 0.2);
      }

      pos.needsUpdate = true;
      geometry.computeVertexNormals();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
