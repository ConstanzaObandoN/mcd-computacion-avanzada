<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DOM Colaborativo - Pantalla Central</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0f172a; color: white; font-family: system-ui, sans-serif; }
    #overlay { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(15,23,42,0.85); padding: 16px 20px; border-radius: 10px; border: 1px solid #334155; }
    h2 { margin: 0 0 6px 0; font-size: 20px; }
    .stat { font-size: 14px; color: #94a3b8; }
    .stat strong { color: #38bdf8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="overlay">
    <h2>🌐 Simulación DOM Colaborativa</h2>
    <div class="stat">Dispositivos activos deformando: <strong id="userCount">0</strong></div>
    <div class="stat">Broker: <strong>EMQX (WebSockets)</strong></div>
  </div>

  <script>
    // 1. Escena Three.js
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 4.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Iluminación
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0x38bdf8, 0.4));

    // Malla deformable (Plano denso viscoelástico)
    const geometry = new THREE.PlaneGeometry(3.5, 3.5, 80, 80);
    const originalPos = geometry.attributes.position.clone();
    
    const material = new THREE.MeshStandardMaterial({
      color: 0x3b82f6,
      wireframe: true,
      roughness: 0.2,
      metalness: 0.8
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // 2. Registro de fuerzas entrantes
    const activeTouches = new Map();

    // 3. Conexión MQTT
    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: "host_screen_" + Math.random().toString(16).substring(2, 6)
    });

    client.on("connect", () => {
      client.subscribe("mcd/dom/shared_mesh");
    });

    client.on("message", (topic, message) => {
      const data = JSON.parse(message.toString());
      // Mapear coordenadas (0 a 1) al espacio 3D de la malla (-1.75 a +1.75)
      activeTouches.set(data.id, {
        x: (data.x - 0.5) * 3.5,
        y: -(data.y - 0.5) * 3.5,
        force: data.force,
        lastSeen: Date.now()
      });
      document.getElementById("userCount").innerText = activeTouches.size;
    });

    // 4. Bucle de Render y Física Elástica
    function animate() {
      requestAnimationFrame(animate);

      const pos = geometry.attributes.position;
      const now = Date.now();

      // Limpiar usuarios inactivos
      for (const [id, u] of activeTouches.entries()) {
        if (now - u.lastSeen > 1200) activeTouches.delete(id);
      }
      document.getElementById("userCount").innerText = activeTouches.size;

      // Calcular deformación por nodo
      for (let i = 0; i < pos.count; i++) {
        const ox = originalPos.getX(i);
        const oy = originalPos.getY(i);
        const oz = originalPos.getZ(i);

        let targetZ = oz;

        activeTouches.forEach(u => {
          const dist = Math.hypot(ox - u.x, oy - u.y);
          const sigma = 0.45; // Radio de afectación
          const displacement = (u.force * 0.8) * Math.exp(-(dist * dist) / (2 * sigma * sigma));
          targetZ -= displacement;
        });

        // Retorno elástico amortiguado (damping)
        const currentZ = pos.getZ(i);
        pos.setZ(i, currentZ + (targetZ - currentZ) * 0.15);
      }

      pos.needsUpdate = true;
      geometry.computeVertexNormals();

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
