<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DOM Play-Doh Colaborativo - Pantalla Central</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0f19; color: white; font-family: system-ui, -apple-system, sans-serif; }
    
    #panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      width: 290px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h3 { margin: 0 0 8px 0; font-size: 16px; color: #f97316; }
    .stat { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .stat strong { color: #38bdf8; }
    
    .btn-reset {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-reset:hover { background: #dc2626; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="panel">
    <h3>🎨 Escultura Play-Doh Colectiva</h3>
    <div class="stat">Escultores conectados: <strong id="userCount">0</strong></div>
    <div class="stat">Última acción: <strong id="lastAction">Esperando conexiones...</strong></div>
    <div class="stat" style="font-size:11px; color:#64748b; margin-top:8px;">Arrastra con el mouse para rotar la escultura.</div>
    <button class="btn-reset" onclick="resetSphere()">🔄 Nueva Bola de Masa</button>
  </div>

  <script>
    // 1. Escena Three.js y Controles de Cámara Orbit
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Iluminación para resaltar volumen sólido y sombras
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    const lightFront = new THREE.DirectionalLight(0xfff7ed, 1.4);
    lightFront.position.set(4, 6, 6);
    scene.add(lightFront);

    const lightRim = new THREE.DirectionalLight(0x38bdf8, 0.6);
    lightRim.position.set(-4, -4, -3);
    scene.add(lightRim);

    // 2. Esfera Sólida Play-Doh
    const RADIUS = 1.6;
    const geometry = new THREE.SphereGeometry(RADIUS, 120, 120);
    const originalPositions = geometry.attributes.position.clone();

    const material = new THREE.MeshStandardMaterial({
      color: 0xf97316,
      roughness: 0.8,
      metalness: 0.05,
      wireframe: false
    });

    const sphereMesh = new THREE.Mesh(geometry, material);
    scene.add(sphereMesh);

    // 3. Función de Deformación Plástica Permanente
    function aplicarDeformacionDirecta(hit, brushRadius, fuerza, modo) {
      if (!hit) return;
      const pos = geometry.attributes.position;
      const direccion = modo === "pull" ? 1 : -1;
      const desplazamientoBase = 0.08 * fuerza * direccion;

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);

        const dist = Math.hypot(vx - hit.x, vy - hit.y, vz - hit.z);

        if (dist < brushRadius) {
          const intensidad = Math.exp(-(dist * dist) / (2 * (brushRadius * 0.45) * (brushRadius * 0.45)));
          const delta = desplazamientoBase * intensidad;

          const norma = Math.hypot(vx, vy, vz) || 1;
          pos.setXYZ(i, vx + (vx / norma) * delta, vy + (vy / norma) * delta, vz + (vz / norma) * delta);
        }
      }

      pos.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    // 4. Conexión MQTT a EMQX
    const activeUsers = new Set();
    const userCountEl = document.getElementById("userCount");
    const lastActionEl = document.getElementById("lastAction");
    const TOPIC = "mcd/dom/shared_mesh";

    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: "host_screen_" + Math.random().toString(16).substring(2, 6),
      clean: true
    });

    client.on("connect", () => {
      client.subscribe(TOPIC);
    });

    client.on("message", (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        activeUsers.add(data.id);
        userCountEl.innerText = activeUsers.size;

        if (data.hitPos) {
          lastActionEl.innerText = `${data.mode === 'pull' ? 'Jalando' : 'Hundiendo'} (${data.id})`;
          aplicarDeformacionDirecta(data.hitPos, data.radius || 0.55, data.force || 1.0, data.mode || "push");
        }
      } catch (e) {
        console.error("Error procesando mensaje:", e);
      }
    });

    // 5. Reiniciar Esfera
    function resetSphere() {
      const pos = geometry.attributes.position;
      const orig = originalPositions;
      for (let i = 0; i < pos.count; i++) {
        pos.setXYZ(i, orig.getX(i), orig.getY(i), orig.getZ(i));
      }
      pos.needsUpdate = true;
      geometry.computeVertexNormals();
      lastActionEl.innerText = "Bola reiniciada";
    }

    // 6. Bucle de Render
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
