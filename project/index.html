<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DOM Play-Doh Colaborativo</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0f19; color: white; font-family: system-ui, sans-serif; }
    #panel { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(15,23,42,0.9); padding: 14px 18px; border-radius: 10px; border: 1px solid #334155; width: 300px; }
    .btn-reset { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; width: 100%; }
    .btn-reset:hover { background: #dc2626; }
    .stat { font-size: 13px; color: #94a3b8; margin-top: 3px; }
    .stat strong { color: #38bdf8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div id="panel">
    <h3 style="margin:0 0 6px 0; font-size:16px;">🎨 Escultor Play-Doh Colectivo</h3>
    <div class="stat">Escultores conectados: <strong id="userCount">0</strong></div>
    <div class="stat">Tip: Arrastra con el mouse para rotar la figura.</div>
    <button class="btn-reset" onclick="resetSphere()">🔄 Nueva Bola de Masa</button>
  </div>

  <script>
    // 1. Escena y Controles de Cámara Orbit
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Iluminación para dar textura de plastilina / arcilla
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const light1 = new THREE.DirectionalLight(0xffedd5, 1.2);
    light1.position.set(5, 10, 7);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0x38bdf8, 0.8);
    light2.position.set(-5, -5, -2);
    scene.add(light2);

    // 2. Esfera de Plastilina (Malla densa deformable)
    let geometry = new THREE.SphereGeometry(1.6, 90, 90);
    let originalPositions = geometry.attributes.position.clone();

    // Material estilo Play-Doh (suave y mate)
    const material = new THREE.MeshStandardMaterial({
      color: 0xf97316, // Color naranja arcilla/play-doh
      roughness: 0.85,
      metalness: 0.05,
      flatShading: false
    });

    const sphereMesh = new THREE.Mesh(geometry, material);
    scene.add(sphereMesh);

    // 3. Deformación Plástica Acumulativa (Sin retorno)
    function deformarMasa(xNorm, yNorm, fuerza, modo) {
      const pos = geometry.attributes.position;
      
      // Proyectar coordenadas del cel al frente de la esfera 3D
      const hitX = (xNorm - 0.5) * 3.2;
      const hitY = -(yNorm - 0.5) * 3.2;
      const hitZ = Math.sqrt(Math.max(0, 1.6 * 1.6 - hitX * hitX - hitY * hitY));

      const radioEfecto = 0.55; // Radio del "dedo" que aplasta
      const direccion = modo === "pull" ? 1 : -1; // Hundir o jalar

      for (let i = 0; i < pos.count; i++) {
        let vx = pos.getX(i);
        let vy = pos.getY(i);
        let vz = pos.getZ(i);

        const dist = Math.hypot(vx - hitX, vy - hitY, vz - hitZ);

        if (dist < radioEfecto) {
          // Curva de deformación suave según distancia
          const factor = (1 - dist / radioEfecto) * (fuerza * 0.05) * direccion;
          
          // Vector normal desde el centro de la esfera
          const len = Math.hypot(vx, vy, vz);
          const nx = vx / len;
          const ny = vy / len;
          const nz = vz / len;

          // Desplazamiento permanente acumulado en el vértice
          pos.setXYZ(i, vx + nx * factor, vy + ny * factor, vz + nz * factor);
        }
      }

      pos.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    // 4. Conexión MQTT
    const activeUsers = new Set();
    const userCountEl = document.getElementById("userCount");

    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: "host_playdoh_" + Math.random().toString(16).substring(2, 6),
      clean: true
    });

    client.on("connect", () => {
      client.subscribe("mcd/dom/shared_mesh");
    });

    client.on("message", (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        activeUsers.add(data.id);
        userCountEl.innerText = activeUsers.size;

        deformarMasa(data.x, data.y, data.force || 0.8, data.mode || "push");
      } catch (e) {
        console.error(e);
      }
    });

    function resetSphere() {
      const pos = geometry.attributes.position;
      const orig = originalPositions;
      for (let i = 0; i < pos.count; i++) {
        pos.setXYZ(i, orig.getX(i), orig.getY(i), orig.getZ(i));
      }
      pos.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
