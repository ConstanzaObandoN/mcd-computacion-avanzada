<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estado hospitalario · Alberta</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.20.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="map" aria-label="Mapa satelital de saturación hospitalaria"></div>
    <header class="floating-panel">
      <div class="brand"><p>COMPUTACIÓN AVANZADA · MCD UAI</p><h1>Estado hospitalario</h1></div>
      <label for="city-filter"><span>Localidad</span><select id="city-filter"><option value="all">Todas las localidades</option><option value="Calgary">Calgary</option><option value="Edmonton">Edmonton</option></select></label>
      <div class="legend" aria-label="Leyenda de saturación"><span><i class="dot optimal"></i>Óptimo <small>&lt; 1 h</small></span><span><i class="dot moderate"></i>Moderado <small>1–3 h</small></span><span><i class="dot critical"></i>Crítico <small>&gt; 3 h</small></span></div>
      <strong id="network-stress" class="stress-badge">Estrés de la Red: —</strong>
      <button id="recommend-button" class="recommend-button" type="button">Recomendar Centro Óptimo</button>
      <div class="live"><i></i><span>Simulación en vivo</span><time id="last-update">—</time></div>
    </header>
    <aside id="map-message" class="map-message" hidden></aside>
    <aside id="inspector" class="inspector" aria-live="polite" hidden>
      <button id="close-inspector" class="close-inspector" type="button" aria-label="Cerrar panel">✕</button>
      <p class="inspector-kicker" id="inspector-city">CENTRO HOSPITALARIO</p>
      <h2 id="inspector-name">—</h2>
      <p class="inspector-label">Tiempo estimado de espera</p>
      <p class="inspector-wait" id="inspector-wait">—</p>
      <div class="inspector-status" id="inspector-status">—</div>
      <div class="capacity-card"><span>Pacientes en sala de espera</span><strong><b id="inspector-patients">—</b> / <b id="inspector-capacity">—</b></strong><div class="capacity-bar"><i id="capacity-fill"></i></div><small>Pacientes / capacidad operativa</small></div>
    </aside>
    <script src="https://unpkg.com/maplibre-gl@5.20.0/dist/maplibre-gl.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
